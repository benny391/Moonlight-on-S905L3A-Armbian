[Unit]
# loadcpufreq loads the cpufreq modules at boot; the module load initialises
# scaling_governor to ondemand. autotune must apply AFTER that, otherwise its
# userspace lock is overwritten within the same boot. The daemon self-heals as
# a second line of defence.
After=loadcpufreq.service cpufrequtils.service sysfsutils.service
Wants=loadcpufreq.service
